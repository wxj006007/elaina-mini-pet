name: Prepare pet PNG

on:
  push:
    branches: [main]
    paths:
      - elaina-spritesheet.png
      - .github/workflows/prepare-png.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and restore binary PNG
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          repo = os.environ["GH_REPOSITORY"]
          path = "elaina-spritesheet.png"
          api = "https://api.github.com/repos/" + repo + "/contents/" + path
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          metadata = json.load(urllib.request.urlopen(urllib.request.Request(api, headers=headers), timeout=30))
          source = "https://raw.githubusercontent.com/" + repo + "/" + os.environ["GH_COMMIT"] + "/" + path
          data = urllib.request.urlopen(source, timeout=30).read()
          signature = b"\x89PNG\r\n\x1a\n"
          if data.startswith(signature):
              print("PNG is already valid.")
          else:
              data = base64.b64decode(data, validate=True)
              assert data.startswith(signature), "File is not a PNG sprite sheet."
              payload = json.dumps({
                  "message": "Store pet sprite sheet as binary PNG",
                  "content": base64.b64encode(data).decode("ascii"),
                  "sha": metadata["sha"],
                  "branch": "main",
              }).encode()
              request = urllib.request.Request(api, data=payload, headers=headers, method="PUT")
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              print("Stored binary PNG:", result["content"]["size"], "bytes")
          PY
